<div style="font-family: Helvetica, Arial, sans-serif; font-size: 14px; color: #1c1c1c; padding: 24px 8px; background-color: #f5f5f5;">
<div style="max-width: 600px; margin: auto; background-color: #ffffff;">

  <div style="background-color: #8BC34A; padding: 20px 28px; text-align: center;">
    <img src="https://www.freedomofmovement.co.za/cdn/shop/files/FOM_4a277dc0-1749-4e5c-92ce-3fccd1ec7e55.png?v=1760905009&width=200" alt="Freedom of Movement" style="height: 28px;" />
  </div>

  <div style="padding: 28px;">
    <p style="font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #8a8a8a; margin: 0 0 6px;">Stock Request Submitted</p>
    <p style="font-size: 20px; font-weight: bold; margin: 0 0 4px;">{{requester_name}}</p>
    <p style="font-size: 12px; color: #8a8a8a; margin: 0 0 24px;">{{department}} &middot; {{request_date}}</p>

    <table style="width:100%; font-size: 13px; margin-bottom: 20px;">
      <tr><td style="padding: 6px 0; color: #8a8a8a; width: 120px;">Reason</td><td style="padding: 6px 0;">{{reason}}</td></tr>
    </table>

    <p style="font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #8a8a8a; margin: 0 0 12px;">Items Requested</p>
    <div style="white-space: pre-wrap; font-family: 'Courier New', Courier, monospace; font-size: 12px; line-height: 1.8; color: #1c1c1c; background-color: #f5f5f5; padding: 14px; border-radius: 4px;">{{item_lines}}</div>

    <p style="margin-top: 28px; padding-top: 16px; border-top: 1px solid #e5e5e5; font-size: 13px; color: #8a8a8a;">
      Log in to Stock Requests to record the Transfer # once this has been picked and moved out.
    </p>
  </div>

  <div style="text-align:center; padding: 16px; font-size: 11px; color: #8a8a8a;">
    Freedom of Movement &middot; Stock Requests
  </div>

</div>
</div>
